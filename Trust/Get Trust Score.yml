info:
  name: Get Trust Score
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/me/trust-score"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

