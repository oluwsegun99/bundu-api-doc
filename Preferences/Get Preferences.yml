info:
  name: Get Preferences
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/me/preferences"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "success": true,
            "data": {
              "interestEnabled": false,
              "silentSavingsEnabled": false,
              "biometricAuth": {
                "enabledForCurrentDevice": false,
                "matchedDeviceId": null,
                "currentDeviceTrusted": false,
                "hasRegisteredDevice": false,
                "reason": "No biometric device has been registered yet"
              }
            }
          }
