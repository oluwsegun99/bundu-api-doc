info:
  name: Get Passcode Status
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/me/security/passcode"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "success": true,
            "data": {
              "passcodeSet": false,
              "passcodeLockedOut": false
            }
          }
