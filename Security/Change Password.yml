info:
  name: Change Password
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/me/security/password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "currentPassword": "OldPassword123",
        "newPassword": "NewPassword123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: ""
      method: PATCH
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "success": true,
            "message": "Password updated successfully"
          }

docs: |-
  Changes the authenticated user's password.

  Validation:
  - `newPassword` minimum length is 8 characters
