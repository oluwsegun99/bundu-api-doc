info:
  name: Resend Circle Invite
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/savings/circle/members/resend-invite"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "membershipId": "REPLACE_WITH_INVITED_MEMBERSHIP_OBJECT_ID"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Captain-only. Membership must still be INVITED. Uses GET with JSON body (matches API — some HTTP clients omit bodies on GET).
