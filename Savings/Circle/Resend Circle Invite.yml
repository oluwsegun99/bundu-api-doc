info:
  name: Resend Circle Invite
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/savings/circle/members/resend-invite"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "inviteId": "REPLACE_WITH_CIRCLE_GROUP_INVITE_OBJECT_ID"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success — GROUP_INVITE (notification)
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Invitation notification queued",
            "data": {
              "resendType": "GROUP_INVITE",
              "inviteId": "66f000000000000000000010",
              "inviteUrl": "https://app.example.com/savings/circle/join?groupId=66f000000000000000000001&inviteId=66f000000000000000000010",
              "groupId": "66f000000000000000000001",
              "inviteeEmail": "member@example.com",
              "inviteType": "REGISTERED_USER",
              "userId": "66f000000000000000000002"
            }
          }
  - name: Success — GROUP_INVITE (email)
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Invitation email queued",
            "data": {
              "resendType": "GROUP_INVITE",
              "inviteId": "66f000000000000000000020",
              "inviteUrl": "https://app.example.com/savings/circle/join?groupId=66f000000000000000000001&inviteId=66f000000000000000000020&nonRegistered=true",
              "groupId": "66f000000000000000000001",
              "inviteeEmail": "friend@example.com",
              "inviteType": "NON_REGISTERED_USER"
            }
          }

docs: "Captain-only: resend by `inviteId` in JSON body. Only PENDING/EXPIRED; ACCEPTED cannot be resent. Delivery by inviteType: REGISTERED_USER → push/in-app; NON_REGISTERED_USER → email. GET + body matches other savings routes."
