info:
  name: Create Circle Group
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/savings/circle/group"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Friday Circle",
        "description": "Optional description",
        "contributionAmount": 500000,
        "frequency": "MONTHLY",
        "numberOfMembers": 5,
        "latePenaltyPercentage": 2,
        "initialFundingWindowHours": 48,
        "votingWindowHours": 12,
        "gracePeriodHours": 24
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: "Creates a circle savings group. Requires Tier 1 KYC. `frequency`: DAILY | WEEKLY | MONTHLY. Optional: `latePenaltyPercentage` (0–5), `initialFundingWindowHours` (1–72), `votingWindowHours` (1–24), `gracePeriodHours` (0–72). Payout policy is not set at create (`payoutPolicy` null until activation)."
