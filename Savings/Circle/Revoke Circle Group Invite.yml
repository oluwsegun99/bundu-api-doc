info:
  name: Revoke Circle Group Invite
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/savings/circle/group/invites/revoke"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "groupId": "REPLACE_WITH_CIRCLE_GROUP_OBJECT_ID",
        "inviteId": "REPLACE_WITH_CIRCLE_GROUP_INVITE_OBJECT_ID"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: ""
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "inviteId": "66f000000000000000000010",
              "groupId": "66f000000000000000000001",
              "status": "REVOKED"
            }
          }

docs: Captain-only. PENDING or EXPIRED → REVOKED. Idempotent if already REVOKED. 409 if ACCEPTED.
