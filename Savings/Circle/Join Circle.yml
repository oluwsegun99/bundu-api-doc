info:
  name: Join Circle
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/savings/circle/members/join"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "inviteId": "REPLACE_WITH_CIRCLE_GROUP_INVITE_OBJECT_ID"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success — joined circle
    request:
      url: ""
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "You have joined the circle successfully",
            "data": {
              "membershipId": "66f000000000000000000030",
              "groupId": "66f000000000000000000001",
              "memberStatus": "ACTIVE"
            }
          }

docs: Authenticated invitee redeems invite by inviteId only. Email or userId must match caller.
