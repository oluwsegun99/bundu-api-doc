info:
  name: Get Circle Payout Policy Election
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/savings/circle/group/REPLACE_WITH_CIRCLE_GROUP_OBJECT_ID/elections/payout-policy"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success (open)
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "groupStatus": "PAYOUT_POLICY_SELECTION",
              "election": {
                "electionId": "66f000000000000000000020",
                "electionType": "PAYOUT_POLICY",
                "sequence": 1,
                "status": "OPEN",
                "openedAt": "2026-01-01T00:00:00.000Z",
                "closesAt": "2026-01-02T00:00:00.000Z",
                "resolvedAt": null,
                "tieBreakRule": "DEFAULT_RANDOMIZED",
                "outcome": null
              },
              "tallies": {
                "RANDOMIZED": 2,
                "ADMIN_ASSIGNED": 1
              },
              "eligibleVoterCount": 5,
              "castCount": 3,
              "myVote": {
                "choice": "RANDOMIZED",
                "castAt": "2026-01-01T12:00:00.000Z"
              }
            }
          }

docs: Member-only. Returns the open payout-policy election, or the latest closed one if voting finished. Includes tallies, vote progress, and the caller's cast when present.
