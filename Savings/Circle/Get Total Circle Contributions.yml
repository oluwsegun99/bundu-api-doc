info:
  name: Get Total Circle Contributions
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/savings/user/circles/contributions/total"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "totalAmount": 1500000,
              "currency": "NGN"
            }
          }

docs: Lifetime sum of SUCCESS circle contributions for the authenticated user (all circles). Amount in minor units.
