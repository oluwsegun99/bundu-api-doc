info:
  name: Invite Circle Member
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/savings/circle/members/invite"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "groupId": "REPLACE_WITH_CIRCLE_GROUP_OBJECT_ID",
        "inviteeEmail": "friend@example.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Captain-only. Invite must be a registered Bundu email.
