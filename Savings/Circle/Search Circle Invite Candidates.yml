info:
  name: Search Circle Invite Candidates
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/savings/circle/members/invite-candidates?search=ja&groupId=REPLACE_WITH_CIRCLE_GROUP_OBJECT_ID&limit=20"
  params:
    - name: search
      value: ja
      type: query
      description: Min 2 chars; username or email prefix
    - name: groupId
      value: REPLACE_WITH_CIRCLE_GROUP_OBJECT_ID
      type: query
    - name: limit
      value: "20"
      type: query
      description: Optional; max 20
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "Invite candidates retrieved",
            "data": [
              {
                "userId": "66f000000000000000000001",
                "username": "janedoe",
                "email": "jane@example.com",
                "alreadyInGroup": false
              },
              {
                "userId": "66f000000000000000000002",
                "username": "johnsmith",
                "email": "john@example.com",
                "alreadyInGroup": true
              }
            ]
          }

docs: Captain-only. Returns registered users with alreadyInGroup for the given circle.
