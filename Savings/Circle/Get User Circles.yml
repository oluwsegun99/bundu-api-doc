info:
  name: Get User Circles
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/savings/user/circles"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "ACTIVE"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "Lists circle groups for the authenticated user. `status`: ACTIVE | COMPLETED. ACTIVE returns ACTIVE memberships in ACTIVE groups; COMPLETED returns COMPLETED memberships in COMPLETED groups. Uses GET with JSON body."
