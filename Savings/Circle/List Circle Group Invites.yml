info:
  name: List Circle Group Invites
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/savings/circle/group/invites?groupId=REPLACE_WITH_CIRCLE_GROUP_OBJECT_ID&take=20"
  params:
    - name: groupId
      value: REPLACE_WITH_CIRCLE_GROUP_OBJECT_ID
      type: query
    - name: cursor
      value: ""
      type: query
      description: Optional; inviteId from previous page
      disabled: true
    - name: take
      value: "20"
      type: query
      description: Optional; default 20, max 100
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "items": [
                {
                  "inviteId": "66f000000000000000000010",
                  "email": "friend@example.com",
                  "inviteType": "NON_REGISTERED_USER",
                  "status": "PENDING",
                  "expiry": "2025-06-03T12:00:00.000Z",
                  "createdAt": "2025-06-01T12:00:00.000Z",
                  "userId": null,
                  "acceptedAt": null,
                  "inviteUrl": "https://app.example.com/savings/circle/join?groupId=66f000000000000000000001&inviteId=66f000000000000000000010&nonRegistered=true"
                }
              ],
              "hasNextPage": false,
              "cursor": null,
              "totalCount": 1
            }
          }
  - name: Forbidden — not captain
    request:
      url: ""
      method: GET
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "statusCode": 403,
            "message": "Only the group captain can list circle invites",
            "error": "Forbidden"
          }

docs: Captain-only. Paginated CircleGroupInvite rows for a group. inviteUrl only on PENDING/EXPIRED. Use inviteType + status for UI; obtain inviteId for resend.
