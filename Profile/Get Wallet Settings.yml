info:
  name: Get Wallet Settings
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/me/wallet-settings"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "success": true,
            "data": {
              "defaultCurrency": "NGN",
              "hideBalance": false,
              "requirePinForTransfers": true,
              "notificationsEnabled": true
            }
          }
