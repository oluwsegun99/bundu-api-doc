info:
  name: Update Wallet Settings
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/me/wallet-settings"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "defaultCurrency": "NGN",
        "hideBalance": true,
        "requirePinForTransfers": true,
        "notificationsEnabled": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: ""
      method: PATCH
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "success": true,
            "message": "Wallet settings updated successfully",
            "data": {
              "defaultCurrency": "NGN",
              "hideBalance": true,
              "requirePinForTransfers": true,
              "notificationsEnabled": false
            }
          }
