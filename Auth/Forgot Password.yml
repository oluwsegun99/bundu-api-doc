info:
  name: Forgot Password
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/forgot-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "user@example.com"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: ""
      method: POST
    response:
      status: 201
      statusText: Created
      body:
        type: text
        data: |-
          {
            "success": true,
            "message": "A password reset link has been sent."
          }

docs: Triggers a password-reset OTP email. Returns success even when the email does not exist.
