info:
  name: Reset Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "user@example.com",
        "otp": "123456",
        "newPassword": "StrongPassword1!"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: ""
      method: POST
    response:
      status: 201
      statusText: Created
      body:
        type: text
        data: |-
          {
            "success": true,
            "message": "Password successfully reset."
          }

docs: Resets the user's password after OTP verification.
