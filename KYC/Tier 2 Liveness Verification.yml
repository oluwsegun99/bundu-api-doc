info:
  name: Tier 2 Liveness Verification
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/kyc/tier2/liveness/verification/{{livenessSessionId}}"
  headers:
    - name: x-device-id
      value: "{{deviceId}}"
      disabled: true
    - name: x-device-fingerprint
      value: ""
      disabled: true
    - name: x-device-platform
      value: ""
      disabled: true
    - name: x-device-model
      value: ""
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "success": true,
            "message": "KYC Tier 2 Liveness verification successful",
            "data": {
              "next": "Verify NIN"
            }
          }
  - name: Success (liveness already verified)
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "success": true,
            "message": "KYC Tier 2 liveness already verified",
            "data": {
              "next": "Verify NIN"
            }
          }

docs: |-
  Completes Tier 2 liveness after the user finishes capture on the Parkway `frontendUrl` from **Tier 2 Liveness Initialization**. Fetches Parkway session results; on pass (confidence >= 70%) sets `tier2.livenessVerified` and stores the audit image for the NIN step.

  Requires Tier 1 verified (`currentTier` >= 1 and `tier1.status` verified); otherwise `400` with `User has not verified tier 1`. `sessionId` must match `tier2.livenessSessionId` from initialization; otherwise `400` with `Invalid liveness session ID`.

  Optional device headers are stored on the verification attempt.

  Errors:
  - `403` if Tier 2 is already verified
  - `400` if Tier 1 not verified (`User has not verified tier 1`)
  - `400` if session ID invalid or liveness fails (`Liveness verification failed`)
  - `500` if Parkway is unavailable
