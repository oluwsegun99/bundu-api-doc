info:
  name: Mark Notification Read
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/me/notifications/REPLACE_NOTIFICATION_ID/read"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

