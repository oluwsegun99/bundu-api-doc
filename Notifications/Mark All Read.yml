info:
  name: Mark All Read
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/me/notifications/read-all"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: ""
      method: PATCH
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "message": "All notifications marked as read",
            "data": {
              "updatedCount": 5
            }
          }
