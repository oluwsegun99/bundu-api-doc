info:
  name: Resend Onboarding OTP
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/onboarding/resend-otp"
  headers:
    - name: x-onboarding-token
      value: "{{onboardingToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Resends the onboarding verification OTP for the active onboarding session.
