info:
  name: Set Onboarding Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/onboarding/set-password"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-onboarding-token
      value: "{{onboardingToken}}"
  body:
    type: json
    data: |-
      {
        "password": "StrongPassword1!"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: ""
      method: POST
    response:
      status: 201
      statusText: Created
      body:
        type: text
        data: |-
          {
            "success": true,
            "data": {
              "next": "set-username"
            }
          }

docs: Adds a strong password to the onboarding session.
